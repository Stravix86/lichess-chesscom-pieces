<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 12px; background: #262421; color: #bababa; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #fff; }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    select { width: 100%; padding: 4px; background: #3a3936; color: #fff; border: 1px solid #555; border-radius: 4px; }
    #preview { display: grid; grid-template-columns: repeat(6, 1fr); margin: 10px 0; background: #779556; border-radius: 4px; }
    #preview img { width: 100%; }
    #preview img:nth-child(-n+6) { background: #ebecd0; }
    button { background: #3a3936; color: #bababa; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    #status { font-size: 12px; margin-top: 6px; min-height: 1em; }
  </style>
</head>
<body>
  <h1>Chess.com pieces on Lichess</h1>
  <label><input type="checkbox" id="enabled"> Enabled</label>
  <select id="theme"></select>
  <div id="preview"></div>
  <button id="clear">Re-download pieces</button>
  <div id="status"></div>
  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
